name: Deploy FYP MCS07

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fypmcs07-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend pytest backend/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to local server
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect to the project tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on GMKtec server
        shell: bash
        run: |
          tailscale ssh fyp_admin@soit-curriculum-analytics '
            set -eu
            cd /opt/fypmcs07
            git fetch origin main
            git checkout -B main origin/main
            docker compose up -d --build --remove-orphans
            curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8000/api/health
            curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/ >/dev/null
          '
