name: Deploy FYP MCS07

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fypmcs07-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fyp_workflow_test
          POSTGRES_USER: mcs07
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcs07 -d fyp_workflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mcs07:test-password@localhost:5432/fyp_workflow_test
      WORKFLOW_TEST_DATABASE_URL: postgresql://mcs07:test-password@localhost:5432/fyp_workflow_test
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          from app import migrations
          with psycopg.connect(os.environ["WORKFLOW_TEST_DATABASE_URL"]) as conn:
              assert conn.info.dbname == "fyp_workflow_test"
              conn.execute(Path("database/init/002_schema.sql").read_text(), prepare=False)
          migrations.MIGRATIONS_DIR = Path("database/migrations").resolve()
          migrations.run_migrations()
          PY
          pytest backend/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          node --test tests/gradebook.test.mjs
          npm run build

  deploy:
    name: Deploy to local server
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect to the project tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on GMKtec server
        shell: bash
        run: |
          tailscale ssh fyp_admin@soit-curriculum-analytics '
            set -eu
            cd /opt/fypmcs07
            git fetch origin main
            git checkout -B main origin/main
            export PUBLIC_APP_URL=https://soit-curriculum-analytics.tail0fb0f0.ts.net
            docker compose up -d --build --remove-orphans
            curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/api/health
            docker compose exec -T backend python -c "from app.main import _password_reset_url; assert _password_reset_url(\"deployment-check\") == \"https://soit-curriculum-analytics.tail0fb0f0.ts.net/reset-password#token=deployment-check\"; print(\"Password reset URL configuration verified\")"
            curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/ >/dev/null
          '
