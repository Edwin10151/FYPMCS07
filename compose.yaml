services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcs07}
      POSTGRES_USER: ${POSTGRES_USER:-mcs07}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcs07-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcs07} -d ${POSTGRES_DB:-mcs07}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mcs07:mcs07-dev-password@db:5432/mcs07}
      SECRET_KEY: ${SECRET_KEY:-mcs07-dev-secret}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Password123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      AUTH_MODE: ${AUTH_MODE:-dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/auth/sso/callback}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_HOSTED_DOMAINS: ${OIDC_HOSTED_DOMAINS:-monash.edu,student.monash.edu}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-60}
      OIDC_EMAIL_CLAIMS: ${OIDC_EMAIL_CLAIMS:-email,preferred_username,upn,unique_name}
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-true}
      LOCAL_LOGIN_MANAGEMENT_ONLY: ${LOCAL_LOGIN_MANAGEMENT_ONLY:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
